  cypress-job:
    runs-on: ubuntu-latest
    #needs: linter-job

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Instal·la les dependencies
        run: npm install

      - name: Run Cypress tests
        run: npm run cypress
        continue-on-error: true 

      - name: Save test results
        if: always() 
        run: |
          echo "Test results:" > result.txt
          cat cypress/results/*.txt >> result.txt  
        continue-on-error: true # Continúa aunque falle este paso

      - name: Upload test results as an artifact
        uses: actions/upload-artifact@v3
        with:
          name: cypress-test-results
          path: result.txt
